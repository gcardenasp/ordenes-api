services:
  oracle:
    image: gvenzl/oracle-free:23
    container_name: ordenes-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Definir ORACLE_PASSWORD en .env}
      APP_USER: ${APP_USER:?Definir APP_USER en .env}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Definir APP_USER_PASSWORD en .env}
      # SYSTIMESTAMP toma la zona del sistema operativo del servidor
      TZ: America/Bogota
    volumes:
      - oracle-datos:/opt/oracle/oradata
      - ./database:/opt/ordenes/database:ro
      - ./docker/oracle/initdb:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  oracle-datos:
